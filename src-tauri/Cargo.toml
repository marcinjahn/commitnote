[package]
name = "commitnote"
version = "0.1.0"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "=2.7.0", features = [] }

[dependencies]
tauri = { version = "=2.12.0", features = [] }
tauri-plugin-dialog = "=2.8.0"
tauri-plugin-fs = "=2.6.0"
tauri-plugin-opener = "=2.6.0"
tauri-plugin-single-instance = "=2.5.0"
tauri-plugin-window-state = "=2.5.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
