name: iOS macOS setup
description: Node, native core build, Xcode selection and project generation for the macOS jobs.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 26
        cache: npm

    - run: npm ci
      shell: bash

    - run: npm run build:native-core
      shell: bash

    - name: Select Xcode
      shell: bash
      run: |
        set -eu
        APP="/Applications/Xcode_${XCODE_VERSION}.app"
        if [ ! -d "$APP" ]; then
          echo "$APP is not installed. Installed Xcodes:" >&2
          ls -d /Applications/Xcode*.app >&2
          exit 1
        fi
        sudo xcode-select -s "$APP"
        xcodebuild -version

    - name: Generate project
      shell: bash
      run: |
        set -eu
        brew install xcodegen
        cd apps/ios
        xcodegen generate
