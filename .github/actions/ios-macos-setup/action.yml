name: iOS macOS setup
description: Node, just, native core build, Xcode selection and project generation for the macOS jobs that build.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: 26
        cache: npm

    - run: npm ci
      shell: bash

    - uses: ./.github/actions/setup-just

    - run: just build-native-core
      shell: bash

    - uses: ./.github/actions/ios-select-xcode

    - name: Generate project
      shell: bash
      run: |
        set -eu
        brew install xcodegen
        just ios generate-project
