name: iOS macOS setup
description: Node, native core build, Xcode selection and project generation for the macOS jobs that build.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 26
        cache: npm

    - run: npm ci
      shell: bash

    - run: npm run build:native-core
      shell: bash

    - uses: ./.github/actions/ios-select-xcode

    - name: Generate project
      shell: bash
      run: |
        set -eu
        brew install xcodegen
        cd apps/ios
        xcodegen generate
