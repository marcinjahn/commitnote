name: iOS select Xcode
description: Selects the Xcode named by XCODE_VERSION.

runs:
  using: composite
  steps:
    - name: Select Xcode
      shell: bash
      run: |
        set -eu
        APP="/Applications/Xcode_${XCODE_VERSION}.app"
        if [ ! -d "$APP" ]; then
          echo "$APP is not installed. Installed Xcodes:" >&2
          ls -d /Applications/Xcode*.app >&2
          exit 1
        fi
        sudo xcode-select -s "$APP"
        xcodebuild -version
