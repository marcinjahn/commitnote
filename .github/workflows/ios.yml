name: iOS

on:
  push:
    branches: [main, "ios-ci/**"]
    paths:
      - "apps/**"
      - "src/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "analytics.config.ts"
      - "svelte.config.js"
      - "tsconfig*.json"
      - ".github/workflows/ios.yml"
      - ".github/actions/ios-*/**"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  XCODE_VERSION: "26.6"

concurrency:
  group: "ios-${{ github.ref }}"
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run check:native-core
      - run: apps/ios/scripts/swift-linux-test.sh

  build:
    name: Build for testing
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ios-macos-setup

      - name: Build for testing
        run: |
          set -eu -o pipefail
          xcodebuild build-for-testing \
            -project apps/ios/Commitnote.xcodeproj \
            -scheme Commitnote \
            -configuration Testing \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath out/dd \
            ARCHS=arm64
          tar -C out/dd/Build/Products -cf out/test-products.tar .
          ls -l out/test-products.tar

      - uses: actions/upload-artifact@v4
        with:
          name: ios-test-products
          path: out/test-products.tar
          compression-level: 1
          retention-days: 1

  macos:
    name: Runtime tests and IPA
    needs: build
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ios-macos-setup
      - uses: ./.github/actions/ios-test-products

      - name: Build unsigned IPA
        run: apps/ios/scripts/build-unsigned-ipa.sh out/ipa

      - name: Check IPA
        run: apps/ios/scripts/check-ipa.sh out/ipa/commitnote-unsigned.ipa

      - name: Boot simulator
        run: |
          set -eu
          SIMULATOR_ID=$(apps/ios/scripts/pick-simulator.sh iphone)
          echo "SIMULATOR_ID=$SIMULATOR_ID" >> "$GITHUB_ENV"
          xcrun simctl bootstatus "$SIMULATOR_ID" -b

      - name: Prepare simulator
        run: apps/ios/scripts/disable-password-autofill.sh "$SIMULATOR_ID"

      - name: Core runtime tests
        run: |
          set -eu -o pipefail
          mkdir -p out/test-output out/xcresults
          TEST_RUNNER_COMMITNOTE_READBACK_DIR="$PWD/out/test-output" \
          xcodebuild test-without-building \
            -xctestrun "$XCTESTRUN" \
            -destination "id=$SIMULATOR_ID" \
            -only-testing:CommitnoteTests \
            -resultBundlePath out/xcresults/runtime.xcresult

      - name: Read back with TypeScript
        run: npx tsx scripts/read-back-native-repo.ts out/test-output

      - uses: actions/upload-artifact@v4
        with:
          name: commitnote-unsigned-ipa
          path: out/ipa/commitnote-unsigned.ipa
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-xcresults-runtime
          path: out/xcresults
          if-no-files-found: ignore
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-test-output
          path: out/test-output
          if-no-files-found: ignore
          retention-days: 30

  ui-tests:
    name: UI tests (${{ matrix.device }}, ${{ matrix.suite }})
    needs: build
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        device: [iphone, ipad]
        suite: [flows, screens]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ios-select-xcode

      - uses: ./.github/actions/ios-test-products

      - name: Boot simulator
        run: |
          set -eu
          SIMULATOR_ID=$(apps/ios/scripts/pick-simulator.sh ${{ matrix.device }})
          echo "SIMULATOR_ID=$SIMULATOR_ID" >> "$GITHUB_ENV"
          xcrun simctl bootstatus "$SIMULATOR_ID" -b

      - name: Prepare simulator
        run: apps/ios/scripts/disable-password-autofill.sh "$SIMULATOR_ID"

      - name: Warm up simulator
        run: |
          set -eu
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
          xcrun simctl install "$SIMULATOR_ID" out/products/Testing-iphonesimulator/commitnote.app
          xcrun simctl launch "$SIMULATOR_ID" io.github.marcinjahn.commitnote
          sleep 30
          xcrun simctl terminate "$SIMULATOR_ID" io.github.marcinjahn.commitnote

      - name: UI tests
        run: |
          set -eu -o pipefail
          case "${{ matrix.suite }}" in
            flows)
              SELECTED="-only-testing:CommitnoteUITests/LoginFlowTests -only-testing:CommitnoteUITests/EditingFlowTests -only-testing:CommitnoteUITests/OrganisationFlowTests"
              ;;
            screens)
              SELECTED="-only-testing:CommitnoteUITests/ScreenshotTests -only-testing:CommitnoteUITests/OrganisationScreenshotTests -only-testing:CommitnoteUITests/EditorFlowTests"
              ;;
          esac
          xcodebuild test-without-building \
            -xctestrun "$XCTESTRUN" \
            -destination "id=$SIMULATOR_ID" \
            $SELECTED \
            -parallel-testing-enabled NO \
            -resultBundlePath out/xcresults/ui-${{ matrix.device }}-${{ matrix.suite }}.xcresult

      - name: Export screenshots
        if: always() && matrix.suite == 'screens'
        run: |
          set -eu
          if [ -d "out/xcresults/ui-${{ matrix.device }}-screens.xcresult" ]; then
            apps/ios/scripts/export-screenshots.sh "out/xcresults/ui-${{ matrix.device }}-screens.xcresult" out/screenshots
          fi

      - uses: actions/upload-artifact@v4
        if: always() && matrix.suite == 'screens'
        with:
          name: ios-screenshots-${{ matrix.device }}
          path: out/screenshots
          if-no-files-found: ignore
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-xcresults-ui-${{ matrix.device }}-${{ matrix.suite }}
          path: out/xcresults
          if-no-files-found: ignore
          retention-days: 30
