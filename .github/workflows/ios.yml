name: iOS

on:
  push:
    branches: [main, "ios-ci/**"]
  workflow_dispatch:

permissions:
  contents: read

env:
  XCODE_VERSION: "26.6"

concurrency:
  group: "ios-${{ github.ref }}"
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run check:native-core
      - run: apps/ios/scripts/swift-linux-test.sh

  macos:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ios-macos-setup

      - name: Swift package tests
        run: |
          set -eu
          (cd apps/ios/Packages/CommitnoteCrypto && swift test)
          (cd apps/ios/Packages/NativeCoreAPI && swift test)
          (cd apps/ios/Packages/EditorText && swift test)

      - name: Boot simulator
        run: |
          set -eu
          IPHONE_ID=$(apps/ios/scripts/pick-simulator.sh iphone)
          echo "IPHONE_ID=$IPHONE_ID" >> "$GITHUB_ENV"
          mkdir -p out/boot
          nohup xcrun simctl bootstatus "$IPHONE_ID" -b > out/boot/iphone.log 2>&1 &

      - name: Build for testing
        run: |
          set -eu -o pipefail
          xcodebuild build-for-testing \
            -project apps/ios/Commitnote.xcodeproj \
            -scheme Commitnote \
            -configuration Testing \
            -destination "id=$IPHONE_ID" \
            -derivedDataPath out/dd

      - name: Prepare simulator
        run: apps/ios/scripts/disable-password-autofill.sh "$IPHONE_ID"

      - name: Core runtime tests
        run: |
          set -eu -o pipefail
          mkdir -p out/test-output out/xcresults
          TEST_RUNNER_COMMITNOTE_READBACK_DIR="$PWD/out/test-output" \
          xcodebuild test-without-building \
            -project apps/ios/Commitnote.xcodeproj \
            -scheme Commitnote \
            -configuration Testing \
            -destination "id=$IPHONE_ID" \
            -derivedDataPath out/dd \
            -only-testing:CommitnoteTests \
            -resultBundlePath out/xcresults/runtime.xcresult

      - name: Read back with TypeScript
        run: npx tsx scripts/read-back-native-repo.ts out/test-output

      - name: Build unsigned IPA
        run: apps/ios/scripts/build-unsigned-ipa.sh out/ipa

      - name: Check IPA
        run: apps/ios/scripts/check-ipa.sh out/ipa/commitnote-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: commitnote-unsigned-ipa
          path: out/ipa/commitnote-unsigned.ipa
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-xcresults-runtime
          path: out/xcresults
          if-no-files-found: ignore
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-test-output
          path: out/test-output
          if-no-files-found: ignore
          retention-days: 30

  ui-tests:
    name: UI tests (${{ matrix.device }})
    runs-on: macos-26
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        device: [iphone, ipad]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ios-macos-setup

      - name: Boot simulator
        run: |
          set -eu
          SIMULATOR_ID=$(apps/ios/scripts/pick-simulator.sh ${{ matrix.device }})
          echo "SIMULATOR_ID=$SIMULATOR_ID" >> "$GITHUB_ENV"
          mkdir -p out/boot
          nohup xcrun simctl bootstatus "$SIMULATOR_ID" -b > out/boot/${{ matrix.device }}.log 2>&1 &

      - name: Build for testing
        run: |
          set -eu -o pipefail
          xcodebuild build-for-testing \
            -project apps/ios/Commitnote.xcodeproj \
            -scheme Commitnote \
            -configuration Testing \
            -destination "id=$SIMULATOR_ID" \
            -derivedDataPath out/dd

      - name: Prepare simulator
        run: apps/ios/scripts/disable-password-autofill.sh "$SIMULATOR_ID"

      - name: Warm up simulator
        run: |
          set -eu
          APP=$(find out/dd/Build/Products -maxdepth 2 -name commitnote.app -type d | head -n 1)
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
          xcrun simctl install "$SIMULATOR_ID" "$APP"
          xcrun simctl launch "$SIMULATOR_ID" io.github.marcinjahn.commitnote
          sleep 30
          xcrun simctl terminate "$SIMULATOR_ID" io.github.marcinjahn.commitnote

      - name: UI tests
        run: |
          set -eu -o pipefail
          xcodebuild test-without-building \
            -project apps/ios/Commitnote.xcodeproj \
            -scheme Commitnote \
            -configuration Testing \
            -destination "id=$SIMULATOR_ID" \
            -derivedDataPath out/dd \
            -only-testing:CommitnoteUITests \
            -parallel-testing-enabled NO \
            -resultBundlePath out/xcresults/ui-${{ matrix.device }}.xcresult

      - name: Export screenshots
        if: always()
        run: |
          set -eu
          if [ -d "out/xcresults/ui-${{ matrix.device }}.xcresult" ]; then
            apps/ios/scripts/export-screenshots.sh "out/xcresults/ui-${{ matrix.device }}.xcresult" out/screenshots
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-screenshots-${{ matrix.device }}
          path: out/screenshots
          if-no-files-found: ignore
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-xcresults-ui-${{ matrix.device }}
          path: out/xcresults
          if-no-files-found: ignore
          retention-days: 30
