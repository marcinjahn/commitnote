name: iOS

on:
  push:
    branches: [main, "ios-ci/**"]
    paths:
      - "apps/**"
      - "src/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "analytics.config.ts"
      - "svelte.config.js"
      - "tsconfig*.json"
      - ".github/workflows/ios.yml"
      - ".github/actions/ios-*/**"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  XCODE_VERSION: "26.6"

concurrency:
  group: "ios-${{ github.ref }}"
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run check:native-core
      - run: apps/ios/scripts/swift-linux-test.sh

  build:
    name: Build for testing
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ios-macos-setup

      - name: Build for testing
        run: |
          set -eu -o pipefail
          xcodebuild build-for-testing \
            -project apps/ios/Commitnote.xcodeproj \
            -scheme Commitnote \
            -configuration Testing \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath out/dd \
            ARCHS=arm64
          tar -C out/dd/Build/Products -cf out/test-products.tar .
          ls -l out/test-products.tar

      - uses: actions/upload-artifact@v4
        with:
          name: ios-test-products
          path: out/test-products.tar
          compression-level: 1
          retention-days: 1

  macos:
    name: Runtime tests and IPA
    needs: build
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ios-macos-setup
      - uses: ./.github/actions/ios-test-products

      - name: Start iPad simulator
        run: |
          set -eu
          IPAD_SIMULATOR_ID=$(apps/ios/scripts/pick-simulator.sh ipad)
          echo "IPAD_SIMULATOR_ID=$IPAD_SIMULATOR_ID" >> "$GITHUB_ENV"
          if ! BOOT_OUTPUT=$(xcrun simctl boot "$IPAD_SIMULATOR_ID" 2>&1); then
            case "$BOOT_OUTPUT" in
              *"current state: Booted"*) ;;
              *) echo "$BOOT_OUTPUT" >&2; exit 1 ;;
            esac
          fi

      - name: Build unsigned IPA
        run: apps/ios/scripts/build-unsigned-ipa.sh out/ipa

      - name: Check IPA
        run: apps/ios/scripts/check-ipa.sh out/ipa/commitnote-unsigned.ipa

      - name: Boot simulator
        run: |
          set -eu
          SIMULATOR_ID=$(apps/ios/scripts/pick-simulator.sh iphone)
          echo "SIMULATOR_ID=$SIMULATOR_ID" >> "$GITHUB_ENV"
          xcrun simctl bootstatus "$SIMULATOR_ID" -b

      - name: Prepare simulator
        run: apps/ios/scripts/disable-password-autofill.sh "$SIMULATOR_ID"

      - name: Core runtime tests
        run: |
          set -eu -o pipefail
          mkdir -p out/test-output out/xcresults
          TEST_RUNNER_COMMITNOTE_READBACK_DIR="$PWD/out/test-output" \
          xcodebuild test-without-building \
            -xctestrun "$XCTESTRUN" \
            -destination "id=$SIMULATOR_ID" \
            -only-testing:CommitnoteTests \
            -resultBundlePath out/xcresults/runtime.xcresult

      - name: Read back with TypeScript
        run: npx tsx scripts/read-back-native-repo.ts out/test-output

      - uses: actions/upload-artifact@v4
        with:
          name: commitnote-unsigned-ipa
          path: out/ipa/commitnote-unsigned.ipa
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-xcresults-runtime
          path: out/xcresults
          if-no-files-found: ignore
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-test-output
          path: out/test-output
          if-no-files-found: ignore
          retention-days: 30

      - name: Prepare iPad simulator
        run: |
          set -eu
          xcrun simctl shutdown "$SIMULATOR_ID"
          xcrun simctl bootstatus "$IPAD_SIMULATOR_ID" -b
          apps/ios/scripts/disable-password-autofill.sh "$IPAD_SIMULATOR_ID"
          xcrun simctl bootstatus "$IPAD_SIMULATOR_ID" -b
          xcrun simctl install "$IPAD_SIMULATOR_ID" out/products/Testing-iphonesimulator/commitnote.app
          xcrun simctl launch "$IPAD_SIMULATOR_ID" io.github.marcinjahn.commitnote
          sleep 30
          xcrun simctl terminate "$IPAD_SIMULATOR_ID" io.github.marcinjahn.commitnote

      - name: iPad UI tests
        run: |
          set -eu -o pipefail
          mkdir -p out/xcresults-ui
          xcodebuild test-without-building \
            -xctestrun "$XCTESTRUN" \
            -destination "id=$IPAD_SIMULATOR_ID" \
            -only-testing:CommitnoteUITests/EditorFlowTests \
            -only-testing:CommitnoteUITests/DataFlowTests \
            -parallel-testing-enabled NO \
            -resultBundlePath out/xcresults-ui/ui-ipad-runtime.xcresult

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-xcresults-ui-ipad-runtime
          path: out/xcresults-ui
          if-no-files-found: ignore
          retention-days: 30

  ui-tests:
    name: UI tests (${{ matrix.device }}, ${{ matrix.suite }})
    needs: build
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        device: [iphone, ipad]
        suite: [flows, screens]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ios-select-xcode

      - uses: ./.github/actions/ios-test-products

      - name: Boot simulator
        run: |
          set -eu
          SIMULATOR_ID=$(apps/ios/scripts/pick-simulator.sh ${{ matrix.device }})
          echo "SIMULATOR_ID=$SIMULATOR_ID" >> "$GITHUB_ENV"
          xcrun simctl bootstatus "$SIMULATOR_ID" -b

      - name: Prepare simulator
        run: apps/ios/scripts/disable-password-autofill.sh "$SIMULATOR_ID"

      - name: Warm up simulator
        run: |
          set -eu
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
          xcrun simctl install "$SIMULATOR_ID" out/products/Testing-iphonesimulator/commitnote.app
          xcrun simctl launch "$SIMULATOR_ID" io.github.marcinjahn.commitnote
          sleep 30
          xcrun simctl terminate "$SIMULATOR_ID" io.github.marcinjahn.commitnote

      - name: UI tests
        run: |
          set -eu -o pipefail
          case "${{ matrix.device }}-${{ matrix.suite }}" in
            iphone-flows)
              SELECTED="-only-testing:CommitnoteUITests/EditingFlowTests -only-testing:CommitnoteUITests/OrganisationFlowTests -only-testing:CommitnoteUITests/MediaFlowTests"
              ;;
            iphone-screens)
              SELECTED="-only-testing:CommitnoteUITests/ScreenshotTests -only-testing:CommitnoteUITests/OrganisationScreenshotTests -only-testing:CommitnoteUITests/EditorFlowTests -only-testing:CommitnoteUITests/MediaScreenshotTests -only-testing:CommitnoteUITests/SettingsScreenshotTests -only-testing:CommitnoteUITests/DataFlowTests -only-testing:CommitnoteUITests/SettingsFlowTests -only-testing:CommitnoteUITests/LoginFlowTests"
              ;;
            ipad-flows)
              SELECTED="-only-testing:CommitnoteUITests/EditingFlowTests -only-testing:CommitnoteUITests/MediaFlowTests -only-testing:CommitnoteUITests/LoginFlowTests -only-testing:CommitnoteUITests/MediaScreenshotTests"
              ;;
            ipad-screens)
              SELECTED="-only-testing:CommitnoteUITests/ScreenshotTests -only-testing:CommitnoteUITests/OrganisationScreenshotTests -only-testing:CommitnoteUITests/SettingsScreenshotTests -only-testing:CommitnoteUITests/OrganisationFlowTests -only-testing:CommitnoteUITests/SettingsFlowTests"
              ;;
          esac
          xcodebuild test-without-building \
            -xctestrun "$XCTESTRUN" \
            -destination "id=$SIMULATOR_ID" \
            $SELECTED \
            -parallel-testing-enabled NO \
            -resultBundlePath out/xcresults/ui-${{ matrix.device }}-${{ matrix.suite }}.xcresult

      - name: Export screenshots
        if: always()
        run: |
          set -eu
          RESULT="out/xcresults/ui-${{ matrix.device }}-${{ matrix.suite }}.xcresult"
          if [ -d "$RESULT" ]; then
            if [ "${{ matrix.suite }}" = screens ]; then
              apps/ios/scripts/export-screenshots.sh "$RESULT" out/screenshots
            else
              apps/ios/scripts/export-screenshots.sh "$RESULT" out/screenshots --allow-empty
            fi
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-screenshots-${{ matrix.device }}${{ matrix.suite == 'flows' && '-flows' || '' }}
          path: out/screenshots
          if-no-files-found: ignore
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-xcresults-ui-${{ matrix.device }}-${{ matrix.suite }}
          path: out/xcresults
          if-no-files-found: ignore
          retention-days: 30
