name: iOS

on:
  push:
    branches: [main, "ios-ci/**"]
    paths:
      - "apps/**"
      - "src/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "analytics.config.ts"
      - "svelte.config.js"
      - "tsconfig*.json"
      - ".github/workflows/ios.yml"
      - ".github/actions/ios-*/**"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  XCODE_VERSION: "26.6"

concurrency:
  group: "ios-${{ github.ref }}"
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run check:native-core
      - run: apps/ios/scripts/swift-linux-test.sh

  build:
    name: Build for testing
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ios-macos-setup

      - name: Build for testing
        run: |
          set -eu -o pipefail
          xcodebuild build-for-testing \
            -project apps/ios/Commitnote.xcodeproj \
            -scheme Commitnote \
            -configuration Testing \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath out/dd \
            ARCHS=arm64
          tar -C out/dd/Build/Products -cf out/test-products.tar .
          ls -l out/test-products.tar

      - uses: actions/upload-artifact@v4
        with:
          name: ios-test-products
          path: out/test-products.tar
          compression-level: 1
          retention-days: 1

  macos:
    name: Runtime tests and IPA
    needs: build
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ios-macos-setup
      - uses: ./.github/actions/ios-test-products

      - name: Build unsigned IPA
        run: |
          set -eu
          SIMULATOR_ID=$(apps/ios/scripts/pick-simulator.sh iphone)
          IPAD_SIMULATOR_ID=$(apps/ios/scripts/pick-simulator.sh ipad)
          echo "SIMULATOR_ID=$SIMULATOR_ID" >> "$GITHUB_ENV"
          echo "IPAD_SIMULATOR_ID=$IPAD_SIMULATOR_ID" >> "$GITHUB_ENV"
          mkdir -p out
          # Both simulators boot and get prepared while the IPA builds.
          (apps/ios/scripts/disable-password-autofill.sh "$SIMULATOR_ID" \
            && apps/ios/scripts/disable-password-autofill.sh "$IPAD_SIMULATOR_ID") > out/simulator-prep.log 2>&1 &
          PREP=$!
          apps/ios/scripts/build-unsigned-ipa.sh out/ipa
          PREP_STATUS=0
          wait "$PREP" || PREP_STATUS=$?
          cat out/simulator-prep.log
          exit "$PREP_STATUS"

      - name: Check IPA
        run: apps/ios/scripts/check-ipa.sh out/ipa/commitnote-unsigned.ipa

      - name: Core runtime tests
        run: |
          set -eu -o pipefail
          mkdir -p out/test-output out/xcresults
          TEST_RUNNER_COMMITNOTE_READBACK_DIR="$PWD/out/test-output" \
          xcodebuild test-without-building \
            -xctestrun "$XCTESTRUN" \
            -destination "id=$SIMULATOR_ID" \
            -only-testing:CommitnoteTests \
            -resultBundlePath out/xcresults/runtime.xcresult

      - name: Read back with TypeScript
        run: npx tsx scripts/read-back-native-repo.ts out/test-output

      - uses: actions/upload-artifact@v4
        with:
          name: commitnote-unsigned-ipa
          path: out/ipa/commitnote-unsigned.ipa
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-xcresults-runtime
          path: out/xcresults
          if-no-files-found: ignore
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-test-output
          path: out/test-output
          if-no-files-found: ignore
          retention-days: 30

      - name: Prepare iPad simulator
        run: |
          set -eu
          xcrun simctl shutdown "$SIMULATOR_ID"
          xcrun simctl bootstatus "$IPAD_SIMULATOR_ID" -b
          xcrun simctl install "$IPAD_SIMULATOR_ID" out/products/Testing-iphonesimulator/commitnote.app
          xcrun simctl launch "$IPAD_SIMULATOR_ID" io.github.marcinjahn.commitnote
          sleep 30
          xcrun simctl terminate "$IPAD_SIMULATOR_ID" io.github.marcinjahn.commitnote

      - name: iPad UI tests
        run: |
          set -eu -o pipefail
          mkdir -p out/xcresults-ui
          xcodebuild test-without-building \
            -xctestrun "$XCTESTRUN" \
            -destination "id=$IPAD_SIMULATOR_ID" \
            -only-testing:CommitnoteUITests/EditorFlowTests \
            -only-testing:CommitnoteUITests/SettingsFlowTests \
            -only-testing:CommitnoteUITests/DataFlowTests \
            -parallel-testing-enabled NO \
            -resultBundlePath out/xcresults-ui/ui-ipad-runtime.xcresult

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-xcresults-ui-ipad-runtime
          path: out/xcresults-ui
          if-no-files-found: ignore
          retention-days: 30

  ui-tests:
    name: UI tests (${{ matrix.device }}, ${{ matrix.suite }})
    needs: build
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        device: [iphone, ipad]
        suite: [flows, screens]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ios-select-xcode

      - uses: ./.github/actions/ios-test-products

      - name: Boot simulators
        run: |
          set -eu
          SIMULATOR_ID=$(apps/ios/scripts/pick-simulator.sh ${{ matrix.device }})
          SECOND_SIMULATOR_ID=$(apps/ios/scripts/sibling-simulator.sh "$SIMULATOR_ID")
          echo "SIMULATOR_ID=$SIMULATOR_ID" >> "$GITHUB_ENV"
          echo "SECOND_SIMULATOR_ID=$SECOND_SIMULATOR_ID" >> "$GITHUB_ENV"
          xcrun simctl boot "$SECOND_SIMULATOR_ID"
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
          xcrun simctl bootstatus "$SECOND_SIMULATOR_ID" -b

      - name: Prepare simulators
        run: |
          set -eu
          apps/ios/scripts/disable-password-autofill.sh "$SIMULATOR_ID" &
          FIRST=$!
          apps/ios/scripts/disable-password-autofill.sh "$SECOND_SIMULATOR_ID"
          wait "$FIRST"

      - name: Warm up simulators
        run: |
          set -eu
          for ID in "$SIMULATOR_ID" "$SECOND_SIMULATOR_ID"; do
            xcrun simctl bootstatus "$ID" -b
            xcrun simctl install "$ID" out/products/Testing-iphonesimulator/commitnote.app
            xcrun simctl launch "$ID" io.github.marcinjahn.commitnote
          done
          sleep 30
          for ID in "$SIMULATOR_ID" "$SECOND_SIMULATOR_ID"; do
            xcrun simctl terminate "$ID" io.github.marcinjahn.commitnote
          done

      - name: UI tests
        run: |
          set -eu -o pipefail
          # Each line is one simulator's share of the suite; both run at once.
          case "${{ matrix.device }}-${{ matrix.suite }}" in
            iphone-flows)
              FIRST="EditingFlowTests LoginFlowTests SettingsFlowTests"
              SECOND="OrganisationFlowTests MediaFlowTests DataFlowTests"
              ;;
            iphone-screens)
              FIRST="ScreenshotTests SettingsScreenshotTests"
              SECOND="EditorFlowTests OrganisationScreenshotTests MediaScreenshotTests"
              ;;
            ipad-flows)
              FIRST="EditingFlowTests"
              SECOND="OrganisationFlowTests MediaFlowTests"
              ;;
            ipad-screens)
              FIRST="ScreenshotTests LoginFlowTests"
              SECOND="OrganisationScreenshotTests MediaScreenshotTests SettingsScreenshotTests"
              ;;
          esac
          run_share() {
            SELECTED=""
            for CLASS in $3; do SELECTED="$SELECTED -only-testing:CommitnoteUITests/$CLASS"; done
            xcodebuild test-without-building \
              -xctestrun "$XCTESTRUN" \
              -destination "id=$1" \
              $SELECTED \
              -parallel-testing-enabled NO \
              -resultBundlePath "out/xcresults/ui-${{ matrix.device }}-${{ matrix.suite }}-$2.xcresult" 2>&1 \
              | sed "s/^/[$2] /"
          }
          run_share "$SIMULATOR_ID" 1 "$FIRST" &
          FIRST_PID=$!
          STATUS=0
          run_share "$SECOND_SIMULATOR_ID" 2 "$SECOND" || STATUS=$?
          wait "$FIRST_PID" || STATUS=$?
          exit "$STATUS"

      - name: Export screenshots
        if: always()
        run: |
          set -eu
          for SHARE in 1 2; do
            RESULT="out/xcresults/ui-${{ matrix.device }}-${{ matrix.suite }}-$SHARE.xcresult"
            if [ -d "$RESULT" ]; then
              apps/ios/scripts/export-screenshots.sh "$RESULT" out/screenshots --allow-empty
            fi
          done
          if [ "${{ matrix.suite }}" = screens ] && [ -z "$(ls -A out/screenshots 2>/dev/null)" ]; then
            echo "no screenshots exported" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-screenshots-${{ matrix.device }}${{ matrix.suite == 'flows' && '-flows' || '' }}
          path: out/screenshots
          if-no-files-found: ignore
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-xcresults-ui-${{ matrix.device }}-${{ matrix.suite }}
          path: out/xcresults
          if-no-files-found: ignore
          retention-days: 30
