name: Linux

on:
  push:
    branches: [main, "linux-ci/**"]
    paths:
      - "apps/linux/**"
      - "apps/ios/Commitnote/Fonts/**"
      - "apps/test-vectors/**"
      - "src/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "analytics.config.ts"
      - "svelte.config.js"
      - "tsconfig*.json"
      - "justfile"
      - ".github/actions/setup-just/**"
      - ".github/workflows/linux.yml"
      - ".github/workflows/flatpak.yml"
      - ".github/workflows/flatpak-smoke-test.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "linux-${{ github.ref }}"
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  linux:
    name: Build and test
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/setup-just
      - run: just build-native-core

      - uses: docker/setup-buildx-action@v4

      - name: Prepare image context
        id: image
        run: |
          set -eu
          apps/linux/scripts/container.sh --write-context "$RUNNER_TEMP/linux-image"
          echo "tag=$(apps/linux/scripts/container.sh --print-image-tag)" >> "$GITHUB_OUTPUT"

      - name: Build container image
        uses: docker/build-push-action@v7
        with:
          context: ${{ runner.temp }}/linux-image
          tags: ${{ steps.image.outputs.tag }}
          load: true
          push: false
          cache-from: type=gha,scope=linux-builder
          cache-to: type=gha,mode=max,scope=linux-builder

      - name: Set cache directory
        run: echo "COMMITNOTE_LINUX_CACHE_DIR=$RUNNER_TEMP/linux-cache" >> "$GITHUB_ENV"

      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/linux-cache
          key: linux-cargo-${{ runner.os }}-${{ hashFiles('apps/linux/Cargo.lock', 'apps/linux/rust-toolchain.toml', 'apps/linux/ci/Dockerfile') }}-${{ github.sha }}
          restore-keys: |
            linux-cargo-${{ runner.os }}-${{ hashFiles('apps/linux/Cargo.lock', 'apps/linux/rust-toolchain.toml', 'apps/linux/ci/Dockerfile') }}-

      - name: Build
        run: just linux build

      - name: Static checks
        run: just linux lint

      - name: Tests
        run: just linux test

      - name: Release check
        run: just linux release-check

      - name: Fix ownership of container output
        if: always()
        run: |
          for dir in "$RUNNER_TEMP/linux-cache" apps/linux/out; do
            if [ -d "$dir" ]; then
              sudo chown -R "$(id -u):$(id -g)" "$dir"
            fi
          done

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: linux-screenshots
          path: apps/linux/out/screenshots
          if-no-files-found: ignore
          retention-days: 30

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: linux-logs
          path: apps/linux/out/logs
          if-no-files-found: ignore
          retention-days: 30

  flatpak:
    name: Flatpak
    uses: ./.github/workflows/flatpak.yml

  flatpak-testing:
    name: Testing Flatpak
    uses: ./.github/workflows/flatpak.yml
    with:
      testing: true

  flatpak-smoke-test:
    name: Flatpak smoke test
    needs: [flatpak, flatpak-testing]
    uses: ./.github/workflows/flatpak-smoke-test.yml
    with:
      release-artifact: ${{ needs.flatpak.outputs.artifact-name }}
      testing-artifact: ${{ needs.flatpak-testing.outputs.artifact-name }}
