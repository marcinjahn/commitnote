<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="referrer" content="no-referrer" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fafafa" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b0b0b" />
    <script>
      try {
        const mode = localStorage.getItem("commitnote.colorMode");
        if (mode === "light" || mode === "dark") {
          const color = document.querySelector(
            'meta[name="theme-color"][media="(prefers-color-scheme: ' + mode + ')"]',
          ).content;
          document.documentElement.dataset.colorMode = mode;
          document.querySelector('meta[name="color-scheme"]').content = mode;
          document
            .querySelectorAll('meta[name="theme-color"]')
            .forEach((meta) => (meta.content = color));
        }
      } catch (e) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/src/assets/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="commitnote" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>commitnote</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
